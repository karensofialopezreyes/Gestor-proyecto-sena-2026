<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >

</head>

<body class="bg-slate-50">

    <div class="max-w-2xl mx-auto px-6 py-10">

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">

            <div class="flex items-center gap-4 mb-8">

                <div class="bg-indigo-100 p-4 rounded-2xl">

                    <i class="fa-solid fa-list-check text-indigo-600 text-3xl"></i>

                </div>

                <div>

                    <h1 class="text-3xl font-bold text-slate-800">
                        Agregar tarea a: {{ proyecto.nombre }}
                    </h1>

                    <p class="text-gray-500 mt-1">
                        Crea una nueva tarea para este proyecto
                    </p>

                </div>

            </div>


            <form method="POST">

                {% csrf_token %}


                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Título de la tarea
                    </label>

                    <input
                        type="text"
                        name="titulo"
                        maxlength="50"
                        required
                        class="w-full border border-gray-300 rounded-xl px-4 py-3"
                    >

                </div>


                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Prioridad
                    </label>

                    <select
                        name="prioridad"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3"
                    >

                        {% for valor, nombre in prioridad_choices %}

                            <option value="{{ valor }}">
                                {{ nombre }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-6">

                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Estado
                    </label>

                    <select
                        name="estado"
                        class="w-full border border-gray-300 rounded-xl px-4 py-3"
                    >

                        {% for valor, nombre in estado_choices %}

                            <option value="{{ valor }}">
                                {{ nombre }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="flex gap-3">

                    <a
                        href="{% url 'ver-proyecto' proyecto.id %}"
                        class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-3 rounded-xl"
                    >
                        Cancelar
                    </a>


                    <button
                        type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl"
                    >
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
