<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Proyectos</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-blue-700 text-white shadow">
        <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
            <h1 class="text-2xl font-bold">📁 Gestor de Proyectos</h1>

        <a href="{% url 'nuevo-proyecto' %}" class="bg-orange-500 px-4 py-2 rounded hover:bg-orange-600">
            Nuevo Proyecto
        </a>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="max-w-6xl mx-auto mt-10">

        <h2 class="text-3xl font-bold text-blue-700 mb-6">
            Mis Proyectos
        </h2>

        <div class="grid md:grid-cols-3 gap-6">

            <!-- Tarjeta -->
            <div class="bg-white rounded-lg shadow p-5">
                <h3 class="text-xl font-bold text-blue-700">
                    Proyecto Web
                </h3>

                <p class="text-gray-600 mt-2">
                    Sistema de gestión de tareas.
                </p>

                <button class="mt-5 bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
                    Ver
                </button>
            </div>

            <!-- Tarjeta -->
            <div class="bg-white rounded-lg shadow p-5">
                <h3 class="text-xl font-bold text-blue-700">
                    Inventario
                </h3>

                <p class="text-gray-600 mt-2">
                    Control de productos.
                </p>

                <button class="mt-5 bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
                    Ver
                </button>
            </div>

            <!-- Tarjeta -->
            <div class="bg-white rounded-lg shadow p-5">
                <h3 class="text-xl font-bold text-blue-700">
                    Tienda Online
                </h3>

                <p class="text-gray-600 mt-2">
                    Proyecto de comercio electrónico.
                </p>

                <button class="mt-5 bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
                    Ver
                </button>
            </div>

        </div>

    </div>

</body>
</html>
